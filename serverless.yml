service: abstractplay-gameslib-playground
org: abstractplay

frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs14.x
  stage: dev
  region: us-east-1
  profile: AbstractPlayDev

plugins:
  - serverless-finch

custom:
  client:
    bucketName: gameslib.dev.abstractplay.com
    distributionFolder: ./dist
    indexDocument: playground.html
    objectHeaders:
      ALL_OBJECTS:
        - name: Cache-Control
          value: no-cache
