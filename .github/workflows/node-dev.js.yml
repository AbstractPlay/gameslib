# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Dev Server CI

on:
  push:
    branches: [ "develop" ]
  repository_dispatch:
    types: [dep_update_dev]
  workflow_dispatch:

jobs:
    build-dev:

        runs-on: ubuntu-latest
        permissions:
          contents: write

        # strategy:
        #   matrix:
        #     node-version: [16.x, 18.x, 20.x]
        #     # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

        steps:
        - uses: actions/checkout@v3
          with:
            ref: "develop"
        - name: Use Node.js 18.x
          uses: actions/setup-node@v3
          with:
            node-version: 18.x
            cache: 'npm'
        - run: echo "@abstractplay:registry=https://npm.pkg.github.com/" >> .npmrc
        - run: echo "//npm.pkg.github.com/:_authToken=${{secrets.PAT_READ_PACKAGES}}" >> .npmrc
        - run: npm i
        - run: npm remove @abstractplay/renderer
        - run: npm i @abstractplay/renderer@development
        - run: npm list @abstractplay/renderer
        - run: npm list @svgdotjs/svg.js
        - run: ls node_modules | grep @svgdotjs
        - run: npm test --if-present
        # --- MACHINE TRANSLATION PIPELINE START ---
        - name: Run Machine Translation on Locales
          env:
            GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          run: node scripts/translate.mjs locales/en/apgames.json locales/en/apresults.json

        - name: Auto-commit Updated Translations Back to Branch
          uses: stefanzweifel/git-auto-commit-action@v5
          with:
            commit_message: "i18n: Auto-translate locale files [skip ci]"
            file_pattern: 'locales/*/*.json'

        - name: Upload translation debug artifacts
          if: failure()
          uses: actions/upload-artifact@v4
          with:
            name: translate-debug-${{ github.run_id }}
            path: bin/translate-debug/
            if-no-files-found: ignore
        # --- MACHINE TRANSLATION PIPELINE END ---
        - name: Configure AWS credentials
          uses: Fooji/create-aws-profile-action@v1
          with:
            profile: AbstractPlayDev
            region: us-east-1
            key: ${{ secrets.AWS_KEY }}
            secret: ${{ secrets.AWS_SECRET }}
        - name: Publish locale files to S3
          run: node scripts/publish-locales.mjs --stage dev
        # prerelease --preid=ci-$GITHUB_RUN_ID
        - run: npm version prerelease --preid=ci-$GITHUB_RUN_ID --no-git-tag-version
        - run: npm run build
        - run: npm pack
        - name: Upload
          uses: actions/upload-artifact@v4
          with:
            name: package
            path: "*.tgz"

        - name: Trigger docs rebuild
          if: github.event_name == 'push'
          run: |
            if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -q '^docs/'; then
              curl -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.PAT_WORKFLOWS }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/AbstractPlay/docs/dispatches \
              -d '{"event_type":"dep_update_dev"}'
            fi

    publish-dev:
        needs: [build-dev]
        runs-on: ubuntu-latest
        steps:
        - name: Upload
          uses: actions/download-artifact@v4
          with:
            name: package
        - uses: actions/setup-node@v3
          with:
            node-version: 18.x
            registry-url: https://npm.pkg.github.com/
            scope: "@abstractplay"
        - run: echo "registry=https://npm.pkg.github.com/@abstractplay" > .npmrc
        - run: npm publish $(ls *.tgz) --tag development
          env:
            NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}

    deploy-playground:
        needs: [publish-dev]
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v4
          with:
            ref: "develop"
        - name: Use Node.js 18.x
          uses: actions/setup-node@v4
          with:
            node-version: 18.x
            cache: 'npm'
        - run: echo "@abstractplay:registry=https://npm.pkg.github.com/" >> .npmrc
        - run: echo "//npm.pkg.github.com/:_authToken=${{secrets.PAT_READ_PACKAGES}}" >> .npmrc
        - run: npm i
        - run: npm remove @abstractplay/renderer
        - run: npm i @abstractplay/renderer@development
        - run: npm run dist-dev
        - name: Configure AWS credentials
          uses: Fooji/create-aws-profile-action@v1
          with:
            profile: AbstractPlayDev
            region: us-east-1
            key: ${{ secrets.AWS_KEY }}
            secret: ${{ secrets.AWS_SECRET }}
        - name: Deploy playground
          env:
            AWS_SDK_LOAD_CONFIG: "1"
            AWS_PROFILE: AbstractPlayDev
          run: npm run deploy:ci

    relay-dev:
        needs: [deploy-playground]
        runs-on: ubuntu-latest
        steps:
          - name: Trigger frontend build and test
            run: |
              curl -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.PAT_WORKFLOWS }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/abstractplay/front/dispatches \
              -d '{"event_type": "dep_update_dev"}'

          - name: Trigger backend build and test
            run: |
                curl -L \
                -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${{ secrets.PAT_WORKFLOWS }}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                https://api.github.com/repos/abstractplay/node-backend/dispatches \
                -d '{"event_type": "dep_update_dev"}'

          - name: Trigger backend-crons build and test
            run: |
                curl -L \
                -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${{ secrets.PAT_WORKFLOWS }}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                https://api.github.com/repos/abstractplay/backend-crons/dispatches \
                -d '{"event_type": "dep_update_dev"}'

          - name: Trigger backend-thumbnails build and test
            run: |
                curl -L \
                -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${{ secrets.PAT_WORKFLOWS }}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                https://api.github.com/repos/abstractplay/backend-thumbnails/dispatches \
                -d '{"event_type": "dep_update_dev"}'
